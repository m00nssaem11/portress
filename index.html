<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>온라인 포트리스</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #10131a;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-synthesis: none; /* 폰트가 진짜 굵게(bold) 없을 때 브라우저가 억지로 뭉개서 굵게 만드는 걸 방지 (흐려 보이는 원인) */
  }
  #stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #canvasWrap {
    position: relative;
    line-height: 0;
  }
  #game {
    background: #10131a;
    box-shadow: 0 0 0 4px #000, 0 0 24px rgba(0,0,0,0.6);
    cursor: pointer;
    display: block;
  }
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .lbl {
    position: absolute;
    pointer-events: none;
    font-family: 'Pretendard', 'Consolas', 'Malgun Gothic', monospace;
    font-weight: 700;
    white-space: pre;
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow:
      -1.5px -1.5px 0 rgba(0,0,0,0.9), 1.5px -1.5px 0 rgba(0,0,0,0.9),
      -1.5px 1.5px 0 rgba(0,0,0,0.9), 1.5px 1.5px 0 rgba(0,0,0,0.9),
      0 0 5px rgba(0,0,0,0.5);
  }
  #hint {
    position: fixed; bottom: 6px; left: 0; right: 0;
    text-align: center; color: #6b7280; font: 11px 'Pretendard', monospace;
    pointer-events: none;
  }

  .setup-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(8,10,16,0.82);
    z-index: 20;
    align-items: center; justify-content: center;
    font-family: 'Pretendard', 'Segoe UI', 'Malgun Gothic', sans-serif;
  }
  .setup-card {
    background: linear-gradient(#20242e, #14161d);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 20px 24px;
    width: min(92vw, 460px);
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .setup-card h2 {
    color: #f0c95c;
    text-align: center;
    margin: 0 0 16px;
    font-size: 20px;
    letter-spacing: 0.03em;
  }
  .setup-players {
    display: flex; gap: 16px;
    flex-wrap: wrap;
  }
  .setup-player {
    flex: 1 1 180px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .setup-player-title {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .setup-player label {
    display: block;
    color: #8a8878;
    font-size: 11px;
    margin: 8px 0 4px;
  }
  .nick-input {
    width: 100%;
    box-sizing: border-box;
    background: #1a1c24;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 5px;
    color: #e8e4d8;
    font-size: 14px;
    padding: 6px 8px;
    font-family: inherit;
  }
  .nick-input:focus {
    outline: none;
    border-color: #f0c95c;
  }
  .swatches {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .swatch {
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.selected {
    border-color: #fff;
    box-shadow: 0 0 0 2px #f0c95c;
  }
  .swatch.disabled {
    opacity: 0.2;
    cursor: not-allowed;
    pointer-events: none;
  }
  .shapes {
    display: flex; gap: 6px;
  }
  .shape-btn {
    flex: 1;
    background: #1a1c24;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 5px;
    color: #b8b6a8;
    font-size: 11px;
    padding: 6px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .shape-btn:hover { background: #23262f; }
  .shape-btn.selected {
    background: #f0c95c;
    color: #2a2410;
    border-color: #f0c95c;
    font-weight: 700;
  }
  .map-section {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  .map-section-title {
    font-weight: 700;
    font-size: 14px;
    color: #f0c95c;
    margin-bottom: 8px;
  }
  .map-grid {
    display: flex; flex-wrap: wrap;
    gap: 8px;
  }
  .map-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: #1a1c24;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 5px;
    cursor: pointer;
    width: 68px;
    box-sizing: border-box;
  }
  .map-btn:hover { background: #23262f; }
  .map-btn canvas {
    display: block;
    border-radius: 3px;
    width: 60px; height: 34px;
  }
  .map-btn span {
    font-size: 10px;
    color: #b8b6a8;
  }
  .map-btn.selected {
    border-color: #f0c95c;
    box-shadow: 0 0 0 2px rgba(240,201,92,0.35);
  }
  .map-btn.selected span {
    color: #f0c95c;
    font-weight: 700;
  }
  .size-grid {
    display: flex; flex-wrap: wrap;
    gap: 8px;
  }
  .size-btn {
    background: #1a1c24;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: #b8b6a8;
    font-size: 12px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .size-btn:hover { background: #23262f; }
  .size-btn.selected {
    border-color: #f0c95c;
    background: rgba(240,201,92,0.12);
    color: #f0c95c;
    font-weight: 700;
  }
  .setup-actions {
    display: flex; gap: 10px;
    margin-top: 20px;
    justify-content: center;
  }
  .setup-btn {
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    border: 2px solid transparent;
  }
  .setup-btn.primary {
    background: linear-gradient(#7fd35c, #4a9832);
    border-color: #2f5a1a;
    color: #fff;
  }
  .setup-btn.primary:hover { filter: brightness(1.08); }
  .setup-btn.ghost {
    background: transparent;
    border-color: rgba(255,255,255,0.2);
    color: #b8b6a8;
  }
  .setup-btn.ghost:hover { background: rgba(255,255,255,0.06); }

  /* ---- 터치 조작 버튼 (모바일에서는 키보드가 없어서 필요) ---- */
  #touchControls {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
    z-index: 15;
  }
  .tc-group { display: flex; gap: 10px; pointer-events: auto; }
  .tc-btn {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(20,22,30,0.55);
    border: 2px solid rgba(255,255,255,0.25);
    color: #f0ece0;
    font-size: 19px;
    font-family: inherit;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  .tc-btn:active { background: rgba(240,201,92,0.4); border-color: #f0c95c; }
  .tc-weapon {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(20,22,30,0.55);
    border: 2px solid rgba(255,255,255,0.25);
    color: #f0ece0;
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    touch-action: none;
  }
  .tc-weapon.selected { background: rgba(240,201,92,0.5); border-color: #f0c95c; }
  .tc-fire {
    pointer-events: auto;
    width: 74px; height: 74px;
    border-radius: 50%;
    background: rgba(200,60,50,0.55);
    border: 2px solid rgba(255,255,255,0.35);
    color: #fff; font-weight: 700; font-size: 13px;
    font-family: inherit;
    touch-action: none;
  }
  .tc-fire:active { background: rgba(255,90,70,0.8); }
  @media (hover: hover) and (pointer: fine) {
    #touchControls { display: none; } /* 마우스/키보드 환경에서는 숨김 */
  }
  #muteBtn {
    position: fixed; top: 8px; right: 8px; z-index: 20;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(20,22,30,0.55); border: 2px solid rgba(255,255,255,0.25);
    color: #f0ece0; font-size: 14px; cursor: pointer; font-family: inherit;
    -webkit-user-select: none; user-select: none;
  }
  #muteBtn:active { background: rgba(240,201,92,0.4); border-color: #f0c95c; }
</style>
</head>
<body>
<div id="stage"><div id="canvasWrap"><canvas id="game"></canvas><div id="hud"></div></div></div>
<div id="hint">← → 이동 　 ↑ ↓ 조준 　 SPACE 발사(누르고 있으면 파워 충전) 　 1 / 2 무기변경</div>
<button type="button" id="muteBtn">🔊</button>
<div id="touchControls">
  <div class="tc-group tc-move">
    <button type="button" class="tc-btn" data-key="ArrowLeft">◀</button>
    <button type="button" class="tc-btn" data-key="ArrowRight">▶</button>
  </div>
  <button type="button" class="tc-fire" id="tcFire">발사</button>
  <div class="tc-group tc-aim">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <button type="button" class="tc-weapon" id="tcWeapon1">①</button>
      <button type="button" class="tc-weapon" id="tcWeapon2">②</button>
    </div>
    <button type="button" class="tc-btn" data-key="ArrowUp">▲</button>
    <button type="button" class="tc-btn" data-key="ArrowDown">▼</button>
  </div>
</div>

<div id="setupScreen" class="setup-overlay">
  <div class="setup-card">
    <h2>탱크 설정</h2>
    <div class="map-section">
      <div class="map-section-title">대전 방식</div>
      <div class="size-grid" id="modeGrid">
        <button type="button" class="size-btn" id="modeLocalBtn">같은 화면 (로컬)</button>
        <button type="button" class="size-btn" id="modeOnlineBtn">온라인 (방 코드)</button>
      </div>
      <div id="onlinePanel" style="display:none;margin-top:10px;">
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="setup-btn primary" id="roomCreateBtn" style="padding:8px 14px;font-size:13px;">방 만들기</button>
          <input type="text" id="roomCodeInput" placeholder="방 코드 4자리" maxlength="4" style="width:100px;text-transform:uppercase;background:#1a1c24;border:1px solid rgba(255,255,255,0.15);border-radius:5px;color:#e8e4d8;font-size:14px;padding:6px 8px;font-family:inherit;">
          <button type="button" class="setup-btn ghost" id="roomJoinBtn" style="padding:8px 14px;font-size:13px;">코드로 참가</button>
        </div>
        <div id="onlineStatus" style="margin-top:8px;font-size:12px;color:#f0c95c;min-height:16px;"></div>
        <div style="margin-top:6px;font-size:11px;color:#8a8878;">온라인 대전은 2인 전용이에요. 방을 만든 사람이 아래 설정(맵/인원/플레이어)을 정하고, 참가자는 코드만 입력하면 자동으로 같은 설정으로 맞춰져요.</div>
      </div>
    </div>
    <div class="map-section">
      <div class="map-section-title">맵 선택</div>
      <div class="map-grid" id="mapGrid"></div>
    </div>
    <div class="map-section">
      <div class="map-section-title">맵 크기</div>
      <div class="size-grid" id="sizeGrid"></div>
      <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:#b8b6a8;cursor:pointer;">
        <input type="checkbox" id="fogModeCheck">
        안개 모드 (상대가 화면에 안 보임 · 미니맵 없이 감으로 조준)
      </label>
    </div>
    <div class="map-section">
      <div class="map-section-title">인원 수</div>
      <div class="size-grid" id="countGrid"></div>
      <label id="teamModeLabel" style="display:none;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:#b8b6a8;cursor:pointer;">
        <input type="checkbox" id="teamModeCheck">
        2:2 팀전 (P1+P2 vs P3+P4)
      </label>
    </div>
    <div class="setup-players" id="playerCards"></div>
    <div class="setup-actions">
      <button id="setup-back-btn" class="setup-btn ghost">뒤로</button>
      <button id="setup-start-btn" class="setup-btn primary">게임 시작</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   온라인 포트리스 - 로컬 핫싯 + Firebase Realtime Database 온라인 대전(2인)

   1) 이 게임은 모든 판정(지형 생성, 바람, 발사, 폭발)을 하나의 순수 함수형
      액션으로 처리하도록 만들어 두었습니다. 실제 게임 상태 변경은 전부
      applyAction(action) 한 곳을 통해서만 일어납니다.
        action 예시:
          { type:'fire', player:0, angle:45, power:78, weapon:0 }

   2) 온라인화 방식: 매치 시작 시 지형 시드(mapSeed)를 방장이 Realtime
      Database에 기록하면 참가자가 그대로 읽어서 양쪽이 동일한 지형으로
      시작합니다. 이후에는 각 턴의 action 객체만 rooms/{roomId}/actions
      아래에 push되고, 양쪽 클라이언트가 그걸 구독해서 동일하게
      applyAction()을 재생(replay)하면 항상 같은 결과가 나옵니다.
      (풀 스테이트 동기화보다 훨씬 가볍습니다)

   3) 네트워크 훅은 아래 NetworkHooks 객체에 있습니다.
        NetworkHooks.sendAction(action)   -> 로컬에서 액션 발생 시 호출됨
        NetworkHooks.onReceiveAction(fn)  -> 원격 액션 수신 시 fn(action) 호출
      로컬 모드(같은 화면)에서는 두 훅이 바로 연결되고, 온라인 모드에서는
      sendAction이 Realtime Database에 push하고, child_added 리스너가
      onReceiveAction으로 넘겨줍니다. 자세한 설정 방법은 아래
      "Firebase 온라인 대전" 섹션의 주석을 참고하세요.
   ========================================================================= */

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  ctx.imageSmoothingEnabled = false;

  // ---- 내부 해상도 (GBA 감성의 저해상도 픽셀 캔버스) ----
  // W,H        = 화면(뷰포트)에 실제로 보이는 크기 - 항상 이 크기만큼만 그려짐
  // mapW,mapH  = 맵(월드) 전체 크기 - 지형/스폰 위치 등은 전부 이 기준
  // 안개 모드가 아니면 W,H === mapW,mapH (기존과 동일하게 맵 전체가 화면에 다 보임)
  // 안개 모드면 W,H는 고정된 작은 화면이고, 카메라(camX,camY)가 mapW×mapH 안에서 움직임
  const BASE_W = 480, BASE_H = 270;
  let W = BASE_W, H = BASE_H;
  let mapW = BASE_W, mapH = BASE_H;
  let mapScale = 1; // 맵 크기 선택에 따라 달라짐 (물리량도 이 값에 맞춰 스케일)
  let fogMode = false; // 안개 모드: 서로 안 보이는 카메라 시야
  const FOG_EXTRA_SCALE = 2.4; // 안개 모드에서는 맵을 화면보다 훨씬 넓게 만들어 스크롤 여유를 확보
  let camX = 0, camY = 0;
  canvas.width = W; canvas.height = H;

  let uiScale = 1;
  function fitCanvas() {
    const stage = document.getElementById('stage');
    const maxW = stage.clientWidth, maxH = stage.clientHeight;
    let scale = Math.min(maxW / W, maxH / H);
    if (scale >= 1) {
      scale = Math.floor(scale * 2) / 2; // 화면이 게임 해상도보다 클 때만 0.5 단위로 스냅 (픽셀아트 유지)
    }
    // scale이 1보다 작다는 건 화면(창)이 게임 기본 해상도보다 작다는 뜻 - 이때는
    // 스냅하지 않고 그대로 축소해서 화면 안에 맞춘다. (예전엔 항상 최소 1배로 고정돼서
    // 작은 화면/창에서는 캔버스가 화면보다 커져 잘리고, 그 결과 버튼 등이 중앙에서
    // 벗어난 것처럼 보이는 문제가 있었다.)
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
    uiScale = scale;
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  // ---------------------------------------------------------------------
  // HUD 오버레이 (진짜 DOM 텍스트 - 저해상도 캔버스 확대로 인한 흐림 방지)
  // ---------------------------------------------------------------------
  const hudSeen = new Set();
  function lbl(id, text, x, y, sizePx, color, align, vAlign) {
    align = align || 'left';
    hudSeen.add(id);
    let el = document.getElementById('lbl-' + id);
    if (!el) {
      el = document.createElement('div');
      el.id = 'lbl-' + id;
      el.className = 'lbl';
      hud.appendChild(el);
    }
    if (text === null || text === undefined || text === '') {
      el.style.display = 'none';
      return;
    }
    el.style.display = 'block';
    if (el.textContent !== text) el.textContent = text;
    el.style.left = (x / W * 100) + '%';
    el.style.top = (y / H * 100) + '%';
    el.style.fontSize = Math.round(sizePx * uiScale) + 'px';
    el.style.color = color;
    const tx = align === 'center' ? '-50%' : (align === 'right' ? '-100%' : '0%');
    const ty = vAlign === 'middle' ? '-50%' : '-68%';
    el.style.transform = `translate(${tx}, ${ty})`;
  }
  function hideUnusedLabels() {
    hud.querySelectorAll('.lbl').forEach(el => {
      const id = el.id.slice(4);
      if (!hudSeen.has(id)) el.style.display = 'none';
    });
    hudSeen.clear();
  }

  // ---------------------------------------------------------------------
  // 유틸
  // ---------------------------------------------------------------------
  function mulberry32(seed) {
    return function() {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const deg2rad = d => d * Math.PI / 180;

  // ---------------------------------------------------------------------
  // 팔레트 (GBA풍)
  // ---------------------------------------------------------------------
  const PAL = {
    skyTop: '#2b3a67', skyMid: '#3f5a8f', skyBot: '#7fa8d4',
    sun: '#ffe9a8', sunCore: '#fff6d8',
    mountainFar: '#26314f', mountainNear: '#1c2540',

  }

  // 맵 타입별 컬러 테마 - 하늘, 산 실루엣, 지형 표면/속살, 파편 색까지 전부 다르게

  let terrain = null; // { data: Uint8ClampedArray(w*h*4), w, h }

  // 맵 타입별 높이 함수. rnd는 시드 고정 PRNG. 프리뷰 렌더링에서도 재사용됨.
  function computeHeights(mapKey, rnd, w, h) {
    const heights = new Float32Array(w);
    switch (mapKey) {
      case 'plains': {
        // 낮고 완만한 평지
        const baseline = h * (0.62 + rnd() * 0.05);
        const amp1 = 6 + rnd() * 5, freq1 = 0.006 + rnd() * 0.005, phase1 = rnd() * 10;
        const amp2 = 3 + rnd() * 3, freq2 = 0.02 + rnd() * 0.01, phase2 = rnd() * 10;
        for (let x = 0; x < w; x++) {
          heights[x] = baseline
            + Math.sin(x * freq1 + phase1) * amp1
            + Math.sin(x * freq2 + phase2) * amp2;
        }
        break;
      }
      case 'mountains': {
        // 험준하고 굴곡이 큰 산악 지형
        const baseline = h * (0.5 + rnd() * 0.08);
        const amp1 = 32 + rnd() * 20, freq1 = 0.018 + rnd() * 0.014, phase1 = rnd() * 10;
        const amp2 = 14 + rnd() * 10, freq2 = 0.05 + rnd() * 0.025, phase2 = rnd() * 10;
        const amp3 = 6 + rnd() * 5, freq3 = 0.09 + rnd() * 0.03, phase3 = rnd() * 10;
        for (let x = 0; x < w; x++) {
          heights[x] = baseline
            + Math.sin(x * freq1 + phase1) * amp1
            + Math.sin(x * freq2 + phase2) * amp2
            + Math.sin(x * freq3 + phase3) * amp3;
        }
        break;
      }
      case 'canyon': {
        // 양쪽은 높은 절벽, 가운데는 깊은 협곡
        const rim = h * (0.36 + rnd() * 0.05);
        const floor = h * (0.76 + rnd() * 0.05);
        const noiseAmp = 5 + rnd() * 4, noiseFreq = 0.05 + rnd() * 0.03, noisePhase = rnd() * 10;
        for (let x = 0; x < w; x++) {
          const t = x / (w - 1);
          const valley = Math.pow(Math.sin(Math.PI * t), 1.4);
          heights[x] = rim + (floor - rim) * valley + Math.sin(x * noiseFreq + noisePhase) * noiseAmp;
        }
        break;
      }
      case 'steps': {
        // 좌우 대칭 계단식 지형
        const baseline = h * (0.4 + rnd() * 0.05);
        const stepH = 14 + rnd() * 6, stepW = 34 + rnd() * 16;
        const noiseAmp = 2 + rnd() * 2, noiseFreq = 0.12 + rnd() * 0.05, noisePhase = rnd() * 10;
        for (let x = 0; x < w; x++) {
          const distFromCenter = Math.abs(x - w / 2);
          const stepIndex = Math.floor(distFromCenter / stepW);
          heights[x] = baseline + stepIndex * stepH + Math.sin(x * noiseFreq + noisePhase) * noiseAmp;
        }
        break;
      }
      default: { // 'hills' - 기본 완만한 언덕
        const baseline = h * (0.60 + rnd() * 0.08);
        const amp1 = 20 + rnd() * 14, freq1 = 0.015 + rnd() * 0.01, phase1 = rnd() * 10;
        const amp2 = 10 + rnd() * 8, freq2 = 0.03 + rnd() * 0.02, phase2 = rnd() * 10;
        for (let x = 0; x < w; x++) {
          heights[x] = baseline
            + Math.sin(x * freq1 + phase1) * amp1
            + Math.sin(x * freq2 + phase2) * amp2;
        }
      }
    }
    return heights;
  }

  function generateTerrain(seed, mapKey) {
    mapKey = mapKey || 'hills';
    const rnd = mulberry32(seed);
    const w = mapW, h = mapH;
    const data = new Uint8ClampedArray(w * h * 4);

    const heights = computeHeights(mapKey, rnd, w, h);

    // 계단 지형은 각이 살아있어야 하므로 스무딩을 건너뜀
    const smoothPasses = mapKey === 'steps' ? 0 : 2;
    for (let pass = 0; pass < smoothPasses; pass++) {
      const copy = heights.slice();
      for (let x = 1; x < w - 1; x++) {
        heights[x] = (copy[x - 1] + copy[x] * 2 + copy[x + 1]) / 4;
      }
    }
    // 탱크가 항상 지형 위에 올라갈 수 있도록 화면 범위 안으로 clamp
    for (let x = 0; x < w; x++) {
      heights[x] = clamp(heights[x], h * 0.12, h * 0.92);
    }

    currentTheme = THEMES[mapKey] || THEMES.hills;
    const rimRGB = hexToRgb(currentTheme.rim);
    const surfARGB = hexToRgb(currentTheme.surfA);
    const surfBRGB = hexToRgb(currentTheme.surfB);
    const deepFromRGB = hexToRgb(currentTheme.deepFrom);
    const deepToRGB = hexToRgb(currentTheme.deepTo);

    for (let x = 0; x < w; x++) {
      const surfaceY = Math.round(heights[x]);
      for (let y = 0; y < h; y++) {
        const idx = (y * w + x) * 4;
        if (y < surfaceY) { continue; } // 하늘 (알파 0)
        const depth = y - surfaceY;
        let r, g, b;
        if (depth === 0) {
          // 표면 라인: 살짝 밝은 림 하이라이트로 경계를 또렷하게
          r = rimRGB[0]; g = rimRGB[1]; b = rimRGB[2];
        } else if (depth < 3) {
          const noise = rnd() < 0.5;
          r = noise ? surfARGB[0] : surfBRGB[0];
          g = noise ? surfARGB[1] : surfBRGB[1];
          b = noise ? surfARGB[2] : surfBRGB[2];
        } else {
          const shade = clamp(depth / 40, 0, 1);
          const noise = (rnd() - 0.5) * 14;
          r = lerp(deepFromRGB[0], deepToRGB[0], shade) + noise;
          g = lerp(deepFromRGB[1], deepToRGB[1], shade) + noise;
          b = lerp(deepFromRGB[2], deepToRGB[2], shade) + noise;
        }
        data[idx] = clamp(r, 0, 255);
        data[idx + 1] = clamp(g, 0, 255);
        data[idx + 2] = clamp(b, 0, 255);
        data[idx + 3] = 255;
      }
    }
    terrain = { data, w, h, heights };
    return heights;
  }

  function terrainSolid(x, y) {
    if (x < 0 || x >= terrain.w || y < 0 || y >= terrain.h) return y >= terrain.h ? true : false;
    return terrain.data[(y * terrain.w + x) * 4 + 3] > 0;
  }

  function surfaceYAt(x) {
    x = clamp(Math.round(x), 0, terrain.w - 1);
    for (let y = 0; y < terrain.h; y++) {
      if (terrainSolid(x, y)) return y;
    }
    return terrain.h;
  }

  let terrainDirty = { x0: 0, y0: 0, x1: mapW, y1: mapH, any: false };
  function markDirty(x0, y0, x1, y1) {
    x0 = clamp(x0, 0, mapW); y0 = clamp(y0, 0, mapH);
    x1 = clamp(x1, 0, mapW); y1 = clamp(y1, 0, mapH);
    if (!terrainDirty.any) {
      terrainDirty = { x0, y0, x1, y1, any: true };
    } else {
      terrainDirty.x0 = Math.min(terrainDirty.x0, x0);
      terrainDirty.y0 = Math.min(terrainDirty.y0, y0);
      terrainDirty.x1 = Math.max(terrainDirty.x1, x1);
      terrainDirty.y1 = Math.max(terrainDirty.y1, y1);
    }
  }

  function carveCircle(cx, cy, r) {
    const x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r);
    const y0 = Math.floor(cy - r), y1 = Math.ceil(cy + r);
    const r2 = r * r;
    for (let y = Math.max(0, y0); y <= Math.min(terrain.h - 1, y1); y++) {
      for (let x = Math.max(0, x0); x <= Math.min(terrain.w - 1, x1); x++) {
        const dx = x - cx, dy = y - cy;
        if (dx * dx + dy * dy <= r2) {
          terrain.data[(y * terrain.w + x) * 4 + 3] = 0;
        }
      }
    }
    markDirty(x0, y0, x1, y1);
  }

  // 임시로 지형을 그려낼 오프스크린 캔버스 (putImageData용)
  const terrCanvas = document.createElement('canvas');
  terrCanvas.width = mapW; terrCanvas.height = mapH;
  const terrCtx = terrCanvas.getContext('2d');
  let terrImageData = null;

  function pushTerrainToCanvas(full) {
    if (!terrImageData) terrImageData = new ImageData(new Uint8ClampedArray(terrain.data), mapW, mapH);
    else terrImageData.data.set(terrain.data);
    if (full || !terrainDirty.any) {
      terrCtx.putImageData(terrImageData, 0, 0);
    } else {
      const dx = terrainDirty.x0, dy = terrainDirty.y0;
      const dw = Math.max(1, terrainDirty.x1 - terrainDirty.x0);
      const dh = Math.max(1, terrainDirty.y1 - terrainDirty.y0);
      terrCtx.putImageData(terrImageData, 0, 0, dx, dy, dw, dh);
    }
    terrainDirty = { x0: 0, y0: 0, x1: 0, y1: 0, any: false };
  }

  // ---------------------------------------------------------------------

  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  window.addEventListener('keydown', ensureAudio, { once: true });
  window.addEventListener('pointerdown', ensureAudio, { once: true });

  function sfxTone(opt) {
    if (audioMuted || !audioCtx) return;
    const { freq, freqEnd = null, dur = 0.15, type = 'sine', vol = 0.25, delay = 0 } = opt;
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function sfxNoise(opt) {
    if (audioMuted || !audioCtx) return;
    const { dur = 0.3, vol = 0.3, filterFreq = 800, filterType = 'lowpass', delay = 0 } = opt;
    const t0 = audioCtx.currentTime + delay;
    const bufferSize = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.setValueAtTime(filterFreq, t0);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    noise.connect(filter).connect(gain).connect(audioCtx.destination);
    noise.start(t0);
    noise.stop(t0 + dur + 0.02);
  }

  function sfxFire() {
    sfxTone({ freq: 190, freqEnd: 55, dur: 0.13, type: 'sawtooth', vol: 0.18 });
    sfxNoise({ dur: 0.09, vol: 0.16, filterFreq: 2200 });
  }
  function sfxExplosion(radius) {
    const big = radius >= 30;
    sfxNoise({ dur: big ? 0.55 : 0.32, vol: big ? 0.45 : 0.32, filterFreq: big ? 260 : 480 });

  function newTank(px, color, colorDark, colorLight, name, facing, shape) {
    return {
      x: px, y: 0, hp: 100, name, color, colorDark, colorLight, facing, shape: shape || 'classic',
      angle: 55, // 수평 기준 고도각(elevation), 0=수평 90=수직. facing과 무관하게 항상 같은 의미.
      power: 0, charging: false, chargeDir: 1,
      fuel: 100, ammo: [Infinity, WEAPONS[1].ammo], weapon: 0,
      alive: true, recoil: 0, treadPhase: 0, hitFlash: 0, bob: Math.random() * 10,
      falling: false, fallStartY: 0
    };
  }

  // p.angle은 "고도각"(0=수평, 90=수직)만 저장하고, 실제 화면상 절대각(포신이 그려지는 방향,
  // 발사 방향)은 탱크가 보는 방향(facing)에 따라 좌우로 뒤집어서 계산한다.
  // 이렇게 분리해두면 ↑/↓ 키가 어느 탱크에서든 "더 위로/더 낮게"로 항상 동일하게 동작한다.
  function toAbsoluteAngle(p) {
    return p.facing > 0 ? p.angle : 180 - p.angle;
  }

  function resolveMapKey() {
    if (selectedMapKey !== 'random') return selectedMapKey;
    const pool = MAPS.filter(m => m.key !== 'random').map(m => m.key);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function applyMapSize(baseScale) {
    // 안개 모드일 때는 맵(월드)을 화면보다 훨씬 크게 만들어서 카메라가 스크롤할 여유를 줌.
    // 물리량(포탄 속도, 이동속도, 중력)은 실제 맵 배율(mapScale)에 맞춰 스케일된다.
    mapScale = baseScale * (fogMode ? FOG_EXTRA_SCALE : 1);
    mapW = Math.round(BASE_W * mapScale);
    mapH = Math.round(BASE_H * mapScale);
    W = fogMode ? BASE_W : mapW;
    H = fogMode ? BASE_H : mapH;
    canvas.width = W; canvas.height = H;
    terrCanvas.width = mapW; terrCanvas.height = mapH;
    terrImageData = null; // 캔버스 크기가 바뀌었으므로 캐시 무효화
    camX = 0; camY = 0;
    fitCanvas();
  }

  function checkGameOver() {
    if (teamMode) {
      const aliveTeams = [...new Set(players.filter(p => p.alive).map(p => p.team))];
      if (aliveTeams.length <= 1) {
        return { over: true, winnerIdx: -1, winnerTeam: aliveTeams.length === 1 ? aliveTeams[0] : null };
      }
      return { over: false };
    }
    const aliveList = players.filter(p => p.alive);
    if (aliveList.length <= 1) {
      return { over: true, winnerIdx: aliveList.length === 1 ? players.indexOf(aliveList[0]) : -1, winnerTeam: null };
    }
    return { over: false };
  }

  // 자연사(낙하 피해 등) 등 발사 판정 바깥에서 죽음이 발생했을 때도 곧바로 승패를 확정짓는다.
  function endGameIfOver() {
    if (state === 'gameover') return;
    const result = checkGameOver();
    if (result.over) {
      winner = result.winnerIdx;
      winnerTeam = result.winnerTeam;
      state = 'gameover';
      spawnConfetti();
      sfxVictory();
    }
  }

  const FALL_DAMAGE_THRESHOLD = 40; // 이 거리(맵 배율 보정 전 픽셀)를 넘어서 떨어지면 피해 시작
  // 모든 탱크의 중력/낙하를 이 함수 하나로 통일해서 처리한다.
  // 예전에는 "현재 턴 탱크"만 낙하 처리가 됐어서, 폭발로 다른 탱크 발밑이 뚫려도
  // 그 탱크 차례가 올 때까지 허공에 떠 있는 것처럼 보이는 버그가 있었다.
  function applyTankGravity(pl, dt) {
    if (!pl.alive) return;
    const groundY = surfaceYAt(pl.x) - 6;
    if (pl.y < groundY - 0.5) {
      if (!pl.falling) { pl.falling = true; pl.fallStartY = pl.y; }
      pl.y = Math.min(groundY, pl.y + 200 * mapScale * dt);
    } else if (pl.falling) {
      pl.falling = false;
      const fallDist = (groundY - pl.fallStartY) / mapScale;
      if (fallDist > FALL_DAMAGE_THRESHOLD) {
        const dmg = clamp(Math.round((fallDist - FALL_DAMAGE_THRESHOLD) * 0.5), 0, 35);
        if (dmg > 0) {
          pl.hp = clamp(pl.hp - dmg, 0, 100);
          pl.hitFlash = 1;
          sfxHit();
          if (pl.hp <= 0) { pl.alive = false; endGameIfOver(); }
        }
      }
      pl.y = groundY;
    }
  }

  function startGame() {
    const sizePreset = MAP_SIZES.find(s => s.key === selectedMapSize) || MAP_SIZES[1];
    applyMapSize(sizePreset.scale);
    if (!onlineMode) mapSeed = (Date.now() % 100000) + Math.floor(Math.random() * 100000);
    generateTerrain(mapSeed, resolveMapKey());

    const n = selectedPlayerCount;
    const margin = 0.12;
    players = [];
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : margin + (1 - margin * 2) * (i / (n - 1));
      const px = Math.round(mapW * t);
      const cfg = playerConfig[i];
      const c = COLOR_PRESETS.find(cc => cc.key === cfg.colorKey) || COLOR_PRESETS[i % COLOR_PRESETS.length];
      const facing = i < n / 2 ? 1 : -1;
      const tank = newTank(px, c.color, c.dark, c.light, cfg.name || ('P' + (i + 1)), facing, cfg.shape);
      tank.team = (teamMode && n === 4) ? (i < 2 ? 'A' : 'B') : null;
      players.push(tank);
    }
    players.forEach(p => { p.y = surfaceYAt(p.x) - 6; });
    current = 0;
    winner = -1; winnerTeam = null;
    nextTurnSetup(true);
    pushTerrainToCanvas(true);
    state = 'aiming';
  }

  function drawMapPreview(canvasEl, mapKey) {
    const pctx = canvasEl.getContext('2d');
    const pw = canvasEl.width, ph = canvasEl.height;
    pctx.clearRect(0, 0, pw, ph);

    if (mapKey === 'random') {
      const sky = pctx.createLinearGradient(0, 0, 0, ph);
      sky.addColorStop(0, '#3f5a8f'); sky.addColorStop(1, '#7fa8d4');
      pctx.fillStyle = sky;
      pctx.fillRect(0, 0, pw, ph);
      pctx.fillStyle = '#f0c95c';
      pctx.font = 'bold 16px monospace';
      pctx.textAlign = 'center';
      pctx.textBaseline = 'middle';
      pctx.fillText('?', pw / 2, ph / 2 + 1);
      return;
    }
    const theme = THEMES[mapKey] || THEMES.hills;
    const sky = pctx.createLinearGradient(0, 0, 0, ph);
    sky.addColorStop(0, theme.sky.top);
    sky.addColorStop(0.55, theme.sky.mid);
    sky.addColorStop(1, theme.sky.bot);
    pctx.fillStyle = sky;
    pctx.fillRect(0, 0, pw, ph);

    // 항상 같은 시드로 미리보기 모양을 고정 (실제 게임은 매번 랜덤 시드)
    const rnd = mulberry32(2024);
    const pw2 = BASE_W, ph2 = BASE_H;
    const heights = computeHeights(mapKey, rnd, pw2, ph2);
    pctx.fillStyle = theme.grassDark;
    pctx.beginPath();
    pctx.moveTo(0, ph);
    for (let x = 0; x < pw2; x += 3) {
      const hy = clamp(heights[x], ph2 * 0.1, ph2 * 0.95);
      pctx.lineTo((x / pw2) * pw, (hy / ph2) * ph);
    }
    pctx.lineTo(pw, (clamp(heights[pw2 - 1], ph2 * 0.1, ph2 * 0.95) / ph2) * ph);
    pctx.lineTo(pw, ph);
    pctx.closePath();
    pctx.fill();
    // 표면 림 라인으로 지형 경계 강조
    pctx.strokeStyle = theme.rim;
    pctx.lineWidth = 1;
    pctx.beginPath();
    for (let x = 0; x < pw2; x += 3) {
      const hy = clamp(heights[x], ph2 * 0.1, ph2 * 0.95);
      const px = (x / pw2) * pw, py = (hy / ph2) * ph;
      if (x === 0) pctx.moveTo(px, py); else pctx.lineTo(px, py);
    }
    pctx.stroke();
  }

  async function createOnlineRoom() {
    if (!db) { setOnlineStatus('Firebase 설정이 안 되어있어요 (코드의 firebaseConfig.databaseURL을 채워주세요).'); return; }
    const roomId = makeRoomCode();
    const seed = (Date.now() % 100000) + Math.floor(Math.random() * 100000);
    try {
      await roomRef(roomId).set({
        status: 'waiting',
        mapKey: selectedMapKey,
        mapSize: selectedMapSize,
        fogMode: fogMode,
        mapSeed: seed,
        playerConfig: [playerConfig[0], playerConfig[1]],
        joinedCount: 1,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });
    } catch (e) {
      setOnlineStatus('방 생성 실패: ' + e.message);
      return;
    }
    onlineMode = true;
    teamMode = false;
    selectedPlayerCount = 2;
    currentRoomId = roomId;
    myPlayerIndex = 0;
    gameStartedFromRoom = false;
    setOnlineStatus(`방 코드: ${roomId} — 상대방이 이 코드로 참가할 때까지 기다리는 중...`);
    listenRoom(roomId);
  }

  async function joinOnlineRoom(rawId) {
    if (!db) { setOnlineStatus('Firebase 설정이 안 되어있어요 (코드의 firebaseConfig.databaseURL을 채워주세요).'); return; }
    const roomId = (rawId || '').trim().toUpperCase();
    if (roomId.length !== 4) { setOnlineStatus('방 코드 4자리를 입력해주세요.'); return; }
    const ref = roomRef(roomId);
    let failReason = null;
    let txResult;
    try {
      txResult = await ref.transaction(data => {
        if (data === null) { failReason = 'NOT_FOUND'; return; } // undefined 반환 시 트랜잭션 중단
        if ((data.joinedCount || 0) >= 2) { failReason = 'FULL'; return; }
        data.joinedCount = 2;
        data.status = 'ready';
        return data;
      });
    } catch (e) {
      setOnlineStatus('참가 실패: ' + e.message);
      return;
    }
    if (!txResult.committed) {
      setOnlineStatus(failReason === 'FULL' ? '이미 인원이 다 찼어요.' : '존재하지 않는 방 코드예요.');
      return;
    }
    const data = txResult.snapshot.val();
    selectedMapKey = data.mapKey;
    selectedMapSize = data.mapSize;
    fogMode = data.fogMode;
    teamMode = false;
    selectedPlayerCount = 2;
    mapSeed = data.mapSeed;
    data.playerConfig.forEach((cfg, i) => { playerConfig[i] = cfg; });
    onlineMode = true;
    currentRoomId = roomId;
    myPlayerIndex = 1;
    gameStartedFromRoom = false;
    setOnlineStatus('참가 완료! 게임을 시작하는 중...');
    listenRoom(roomId);
  }

  function listenRoom(roomId) {
    if (roomUnsub) roomUnsub();
    const rref = roomRef(roomId);
    const roomHandler = snap => {
      const data = snap.val();
      if (!data) return;
      if (data.mapSeed) mapSeed = data.mapSeed;
      if (data.status === 'ready' && !gameStartedFromRoom) {
        gameStartedFromRoom = true;
        setOnlineStatus('상대방 접속 완료! 시작합니다.');
        setupScreen.style.display = 'none';
        startGame();
      }
    };
    rref.on('value', roomHandler);
    roomUnsub = () => rref.off('value', roomHandler);

    if (actionsUnsub) actionsUnsub();
    const aref = actionsRef(roomId);
    const actionHandler = snap => { applyAction(snap.val()); };
    aref.on('child_added', actionHandler);
    actionsUnsub = () => aref.off('child_added', actionHandler);
  }

  function leaveOnlineRoom() {
    if (roomUnsub) { roomUnsub(); roomUnsub = null; }
    if (actionsUnsub) { actionsUnsub(); actionsUnsub = null; }
    onlineMode = false;
    currentRoomId = null;
    gameStartedFromRoom = false;
  }

  function applyAction(action) {
    // 온라인/로컬 액션 모두 이 함수 하나를 통해서만 게임 상태에 반영됩니다.
    if (!action) return;
    if (action.type === 'fire') {
      fireProjectile(action.player, action.angle, action.power, action.weapon);
    } else if (action.type === 'pass') {
      // 제한시간 초과로 그냥 턴 넘김 (아무것도 쏘지 않음)
      if (action.player === current && (state === 'aiming')) {
        sfxMiss();
        nextTurnSetup(false);
      }
    }
  }

  const NetworkHooks = {
    sendAction(action) {
      if (onlineMode && currentRoomId && db) {
        actionsRef(currentRoomId).push(Object.assign({}, action, { ts: Date.now() }))
          .catch(e => console.warn('액션 전송 실패:', e));
      } else {
        NetworkHooks.onReceiveAction(action); // 로컬 핫싯: 즉시 자기 자신에게 반영
      }
    },
    onReceiveAction(action) { applyAction(action); }
  };

  function fireProjectile(playerIdx, angle, power, weaponIdx) {
    const p = players[playerIdx];
    const w = WEAPONS[weaponIdx];
    if (w.ammo !== Infinity) {
      if (p.ammo[weaponIdx] <= 0) return;
      p.ammo[weaponIdx]--;
    }
    const rad = deg2rad(angle);
    const speed = (90 + (power / 100) * 220) * mapScale;
    const mx = p.x + Math.cos(rad) * 13, my = p.y - 6 - Math.sin(rad) * 13;
    projectile = {
      x: p.x,
      y: p.y - Math.sin(rad) * 11,
      vx: Math.cos(rad) * speed,
      vy: -Math.sin(rad) * speed,
      weapon: weaponIdx,
      owner: playerIdx,
      trail: [],
      spin: 0
    };
    p.recoil = 1;
    spawnMuzzleFlash(mx, my, rad);
    sfxFire();
    state = 'firing';
  }

  function spawnMuzzleFlash(x, y, rad) {
    for (let i = 0; i < 10; i++) {
      const a = rad + (Math.random() - 0.5) * 0.8;
      const sp = 60 + Math.random() * 100;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: -Math.sin(a) * sp,
        life: 0.15 + Math.random() * 0.12, maxLife: 0.27,
        color: Math.random() < 0.5 ? PAL.spark : PAL.fire, size: 2, kind: 'spark'
      });
    }
  }

  function scorchRing(cx, cy, r) {
    // 크레이터 가장자리 남은 지형을 살짝 그을려서 폭발 흔적을 남김
    const rOuter = r + 6;
    const x0 = Math.max(0, Math.floor(cx - rOuter)), x1 = Math.min(terrain.w - 1, Math.ceil(cx + rOuter));
    const y0 = Math.max(0, Math.floor(cy - rOuter)), y1 = Math.min(terrain.h - 1, Math.ceil(cy + rOuter));
    for (let yy = y0; yy <= y1; yy++) {
      for (let xx = x0; xx <= x1; xx++) {
        const dx = xx - cx, dy = yy - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d >= r && d < rOuter) {
          const idx = (yy * terrain.w + xx) * 4;
          if (terrain.data[idx + 3] > 0) {
            const t = 1 - (d - r) / (rOuter - r);
            terrain.data[idx] *= (1 - 0.55 * t);
            terrain.data[idx + 1] *= (1 - 0.55 * t);
            terrain.data[idx + 2] *= (1 - 0.55 * t);
          }
        }
      }
    }
  }

  // 폭발 지점에서 탱크까지 사이에 파괴되지 않은 지형이 가로막고 있으면 스플래시 피해를 막는다
  // (언덕 반대편에 숨어있는데 관통 피해를 입는 걸 방지)
  function hasLineOfSight(x0, y0, x1, y1) {
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const steps = Math.max(4, Math.ceil(dist / 4));
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      if (terrainSolid(Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t))) return false;
    }
    return true;
  }

  function explodeAt(x, y, weaponIdx, owner) {
    const w = WEAPONS[weaponIdx];
    carveCircle(x, y, w.radius);
    scorchRing(x, y, w.radius);
    pushTerrainToCanvas(false);
    spawnExplosion(x, y, w.radius);
    shake = Math.max(shake, w.radius * 0.35);
    flash = 1;
    sfxExplosion(w.radius);

    let anyHit = false;
    players.forEach((pl, i) => {
      if (!pl.alive) return;
      const dist = Math.hypot(pl.x - x, pl.y - y);
      if (dist < w.radius + 10) {
        if (!hasLineOfSight(x, y, pl.x, pl.y - 4)) return; // 지형에 가려져 있으면 피해 없음
        const falloff = clamp(1 - dist / (w.radius + 10), 0, 1);
        const dmg = Math.round(w.dmg * falloff);
        if (dmg > 0) { pl.hitFlash = 1; anyHit = true; }
        pl.hp = clamp(pl.hp - dmg, 0, 100);
      }
    });
    if (anyHit) sfxHit();
    projectile = null;
    state = 'resolving';
    resolveTimer = 0.5;
  }

  function spawnExplosion(x, y, radius) {
    // 코어 플래시 링
    particles.push({ x, y, vx: 0, vy: 0, life: 0.18, maxLife: 0.18, kind: 'ring', color: '#fff6d8', radius });
    // 불꽃 파편
    const fireCount = Math.round(14 + radius * 0.4);
    for (let i = 0; i < fireCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 110;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
        life: 0.35 + Math.random() * 0.35, maxLife: 0.7,
        color: [PAL.fire, PAL.fire2, PAL.fire3][Math.floor(Math.random() * 3)],
        size: 2 + Math.random() * 2, kind: 'fire'
      });
    }
    // 연기 (위로 천천히 상승하며 퍼짐)
    const smokeCount = Math.round(8 + radius * 0.25);
    for (let i = 0; i < smokeCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 10 + Math.random() * 24;
      particles.push({
        x: x + Math.cos(a) * radius * 0.3, y: y + Math.sin(a) * radius * 0.3,
        vx: Math.cos(a) * sp, vy: -20 - Math.random() * 20,
        life: 0.8 + Math.random() * 0.6, maxLife: 1.4,
        color: PAL.smoke, size: 3 + Math.random() * 4, kind: 'smoke', grow: 1.6
      });
    }
    // 흙 파편 (중력 + 회전)
    const debrisCount = Math.round(6 + radius * 0.3);
    for (let i = 0; i < debrisCount; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.4;
      const sp = 60 + Math.random() * 140;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.6 + Math.random() * 0.5, maxLife: 1.1,
        color: [currentTheme.dirtLight, currentTheme.dirtMid, currentTheme.dirtDark][Math.floor(Math.random() * 3)],
        size: 2 + Math.random() * 2, kind: 'debris', rot: Math.random() * Math.PI, rotSpd: (Math.random() - 0.5) * 10, grav: true
      });
    }
  }

  function spawnConfetti() {
    let colors;
    if (winnerTeam) {
      const teamPlayers = players.filter(p => p.team === winnerTeam);
      colors = teamPlayers.length
        ? [].concat(...teamPlayers.map(p => [p.color, p.colorLight])).concat(PAL.uiAccent)
        : [PAL.uiAccent];
    } else if (winner < 0) {
      // 무승부: 참가자 전원의 색을 섞어서 사용
      colors = players.length ? [].concat(...players.map(p => [p.color, p.colorLight])) : [PAL.uiAccent];
    } else {
      colors = [players[winner].color, players[winner].colorLight, PAL.uiAccent, '#fff'];
    }
    for (let i = 0; i < 46; i++) {
      particles.push({
        x: camX + Math.random() * W, y: camY - 10 - Math.random() * 60,
        vx: (Math.random() - 0.5) * 30, vy: 20 + Math.random() * 30,
        life: 2.4 + Math.random() * 1.2, maxLife: 3.6,
        color: colors[Math.floor(Math.random() * colors.length)],
        kind: 'confetti', rot: Math.random() * Math.PI, rotSpd: (Math.random() - 0.5) * 6
      });
    }
  }

  let resolveTimer = 0;

  // ---------------------------------------------------------------------
  // 입력
  // ---------------------------------------------------------------------
  const keys = {};

  function selectWeapon(idx) {
    if (state !== 'aiming') return;
    if (onlineMode && current !== myPlayerIndex) return;
    if (idx === 1 && WEAPONS[1].ammo <= 0) return;
    players[current].weapon = idx;
  }

  function releaseFire() {
    if (state !== 'aiming') return;
    if (onlineMode && current !== myPlayerIndex) return;
    const p = players[current];
    if (p.charging) {
      p.charging = false;
      const power = p.power;
      p.power = 0;
      NetworkHooks.sendAction({ type: 'fire', player: current, angle: toAbsoluteAngle(p), power, weapon: p.weapon });
    }
  }

  window.addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    if (e.key === '1') selectWeapon(0);
    if (e.key === '2') selectWeapon(1);
  });
  window.addEventListener('keyup', e => {
    keys[e.key] = false;
    if (e.key === ' ') releaseFire();
  });

  // ---- 터치(모바일) 조작 버튼: 키보드가 없는 기기에서 이동/조준/발사/무기변경 ----
  function bindHoldButton(el, key) {
    if (!el) return;
    const press = ev => { ev.preventDefault(); keys[key] = true; };
    const release = () => { keys[key] = false; if (key === ' ') releaseFire(); };
    el.addEventListener('pointerdown', press);
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('pointerleave', release);
  }
  document.querySelectorAll('.tc-btn[data-key]').forEach(btn => bindHoldButton(btn, btn.dataset.key));
  bindHoldButton(document.getElementById('tcFire'), ' ');
  document.getElementById('tcWeapon1').addEventListener('pointerdown', e => { e.preventDefault(); selectWeapon(0); });
  document.getElementById('tcWeapon2').addEventListener('pointerdown', e => { e.preventDefault(); selectWeapon(1); });

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width * W;
    const my = (e.clientY - rect.top) / rect.height * H;
    if (state === 'title') {
      if (mx > W / 2 - 65 && mx < W / 2 + 65 && my > H / 2 + 34 && my < H / 2 + 68) {
        openSetupScreen();
      }
    } else if (state === 'gameover') {
      if (onlineMode) {
        const btnW = 150, btnH = 34, btnX = W / 2 - btnW / 2, btnY = H / 2 + 40;
        if (mx > btnX && mx < btnX + btnW && my > btnY && my < btnY + btnH) {
          openSetupScreen();
        }
      } else {
        const btnW = 122, gap = 10, btnH = 34;
        const totalW = btnW * 2 + gap;
        const startX = W / 2 - totalW / 2, btnY = H / 2 + 40;
        if (my > btnY && my < btnY + btnH) {
          if (mx > startX && mx < startX + btnW) {
            startGame(); // 같은 참가자/설정으로 다시 시작 (새 지형)
          } else if (mx > startX + btnW + gap && mx < startX + btnW + gap + btnW) {
            openSetupScreen();
          }
        }
      }
    }
  });

  // ---------------------------------------------------------------------
  // 업데이트
  // ---------------------------------------------------------------------
  let lastT = performance.now();
  function update(dt) {
    bgTime += dt;

    // 모든 탱크에 중력을 통일해서 적용 (자기 턴이 아니어도 발밑이 뚫리면 즉시 낙하)
    players.forEach(pl => applyTankGravity(pl, dt));

    if (state === 'aiming') {
      const p = players[current];
      if (turnMsgTimer > 0) turnMsgTimer -= dt;
      const iControlThis = !onlineMode || current === myPlayerIndex;

      // 이동
      let moving = false;
      if (iControlThis && p.fuel > 0) {
        if (keys['ArrowLeft']) { p.x -= 60 * mapScale * dt; moving = true; }
        if (keys['ArrowRight']) { p.x += 60 * mapScale * dt; moving = true; }
      }
      if (moving) {
        p.x = clamp(p.x, 6, mapW - 6);
        p.fuel = clamp(p.fuel - dt * 40, 0, 100);
        p.y = surfaceYAt(p.x) - 6; // 이동 중엔 항상 지면에 붙어서 이동 (낙하 취급 안 함)
        p.falling = false;
        p.treadPhase += dt * 8;
      }

      // 조준
      if (iControlThis) {
        const aimSpeed = 55 * dt;
        if (keys['ArrowUp']) p.angle = clamp(p.angle + aimSpeed, 2, 88);
        if (keys['ArrowDown']) p.angle = clamp(p.angle - aimSpeed, 2, 88);

        // 파워 차징 (누르고 있으면 0->100 왕복)
        if (keys[' ']) {
          p.charging = true;
          p.power += p.chargeDir * 130 * dt;
          if (p.power >= 100) { p.power = 100; p.chargeDir = -1; }
          if (p.power <= 0) { p.power = 0; p.chargeDir = 1; }
        }
      }

      // 턴 제한시간
      if (turnTimeLeft > 0) {
        turnTimeLeft = Math.max(0, turnTimeLeft - dt);
        if (turnTimeLeft <= 0 && iControlThis) {
          if (p.charging) {
            releaseFire();
          } else {
            NetworkHooks.sendAction({ type: 'pass', player: current });
          }
        }
      }
    } else if (state === 'firing') {
      const proj = projectile;
      if (proj) {
        const steps = 6;
        const sdt = dt / steps;
        for (let s = 0; s < steps; s++) {
          proj.vy += 260 * mapScale * sdt;
          proj.vx += wind * 6 * mapScale * sdt;
          const nx = proj.x + proj.vx * sdt;
          const ny = proj.y + proj.vy * sdt;
          proj.trail.push({ x: proj.x, y: proj.y });
          if (proj.trail.length > 14) proj.trail.shift();

          // 상대 탱크 충돌 (자기 자신은 절대 직격 판정에서 제외 — 발사 직후 자폭 버그 방지)
          let hitTank = -1;
          for (let i = 0; i < players.length; i++) {
            if (i === proj.owner) continue;
            const pl = players[i];
            if (!pl.alive) continue;
            if (Math.hypot(pl.x - nx, pl.y - ny) < 8) { hitTank = i; break; }
          }
          if (hitTank >= 0) { explodeAt(nx, ny, proj.weapon, proj.owner); return; }

          if (nx < 0 || nx >= mapW) { missAndSwitch('맵 밖으로 벗어남'); return; }
          if (ny >= mapH) { explodeAt(clamp(nx, 0, mapW - 1), mapH - 1, proj.weapon, proj.owner); return; }
          if (terrainSolid(Math.round(nx), Math.round(ny))) { explodeAt(nx, ny, proj.weapon, proj.owner); return; }

          proj.x = nx; proj.y = ny;
        }
      }
    } else if (state === 'resolving') {
      resolveTimer -= dt;
      if (resolveTimer <= 0) {
        particles = particles.filter(pt => pt.life > 0);
        players.forEach(pl => { if (pl.hp <= 0) pl.alive = false; });
        const result = checkGameOver();
        if (result.over) {
          winner = result.winnerIdx;
          winnerTeam = result.winnerTeam;
          state = 'gameover';
          spawnConfetti();
          sfxVictory();
        } else {
          nextTurnSetup(false);
          state = 'aiming';
        }
      }
    }

    if (missMsgTimer > 0) {
      missMsgTimer -= dt;
      if (missMsgTimer <= 0) {
        nextTurnSetup(false);
        state = 'aiming';
      }
    }

    particles.forEach(pt => {
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      if (pt.kind === 'smoke') {
        pt.vy *= (1 - 1.2 * dt);
        pt.vx *= (1 - 1.2 * dt);
      } else if (pt.kind === 'debris') {
        pt.vy += 260 * dt;
        pt.rot += pt.rotSpd * dt;
      } else if (pt.kind === 'confetti') {
        pt.vy += 70 * dt;
        pt.vx += Math.sin(bgTime * 3 + pt.x) * 12 * dt;
        pt.rot += pt.rotSpd * dt;
      } else if (pt.kind === 'ring') {
        // 정지, life만 감소
      } else {
        pt.vy += 200 * dt;
      }
      pt.life -= dt;
    });
    particles = particles.filter(pt => pt.life > 0);

    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    if (flash > 0) flash = Math.max(0, flash - dt * 3.5);
    players.forEach(p => {
      if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - dt * 3.5);
      if (p.hitFlash > 0) p.hitFlash = Math.max(0, p.hitFlash - dt * 2.5);
    });
  }

  let missMsgTimer = 0;
  function missAndSwitch(msg) {
    projectile = null;
    missMsg = msg;
    missMsgTimer = 0.9;
    sfxMiss();
    state = 'resolving-miss';
  }

  // ---------------------------------------------------------------------
  // 렌더링
  // ---------------------------------------------------------------------
  // 카메라: 안개 모드가 아니면 항상 (0,0) 고정 (기존과 동일하게 맵 전체가 다 보임).
  // 안개 모드면 발사 중엔 포탄을, 그 외엔 현재 턴 플레이어의 탱크를 따라감.
  function updateCamera() {
    if (!fogMode) { camX = 0; camY = 0; return; }
    let tx, ty;
    if (state === 'firing' && projectile) {
      tx = projectile.x; ty = projectile.y;
    } else if (players[current]) {
      tx = players[current].x; ty = players[current].y;
    } else {
      tx = mapW / 2; ty = mapH / 2;
    }
    camX = clamp(tx - W / 2, 0, Math.max(0, mapW - W));
    camY = clamp(ty - H / 2, 0, Math.max(0, mapH - H));
  }

  const WIND_PANEL_W = 84;
  function layoutHPBarWidth() {
    const n = players.length || 1;
    const reserved = WIND_PANEL_W + 12; // 오른쪽 위 WIND 표시와 겹치지 않게 여유 공간 확보
    const avail = W - 16 - reserved - 6 * (n - 1);
    return clamp(avail / n, 46, 92);
  }

  let bgTime = 0;
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, currentTheme.sky.top);
    g.addColorStop(0.55, currentTheme.sky.mid);
    g.addColorStop(1, currentTheme.sky.bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 태양 (은은한 글로우 링)
    const sx = W * 0.78, sy = H * 0.22;
    for (let ring = 3; ring >= 1; ring--) {
      ctx.globalAlpha = 0.10 * ring;
      ctx.fillStyle = PAL.sun;
      ctx.beginPath();
      ctx.arc(sx, sy, 14 + ring * 8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAL.sunCore;
    ctx.beginPath();
    ctx.arc(sx, sy, 13, 0, Math.PI * 2);
    ctx.fill();

    // 흘러가는 구름 (두 겹, 시차)
    ctx.fillStyle = PAL.cloudDim;
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 160 + bgTime * 6) % (W + 120)) - 60;
      const cy = 30 + (i % 2) * 26;
      drawCloud(cx, cy, 0.8);
    }
    ctx.fillStyle = PAL.cloud;
    for (let i = 0; i < 3; i++) {
      const cx = ((i * 210 + 90 + bgTime * 12) % (W + 140)) - 70;
      const cy = 14 + (i % 2) * 20;
      drawCloud(cx, cy, 1.1);
    }

    // 먼 산 실루엣 (시차 2겹)
    drawMountainRange(currentTheme.mountainFar, H * 0.62, 26, 0.6, bgTime * 2);
    drawMountainRange(currentTheme.mountainNear, H * 0.68, 34, 0.9, bgTime * 4);
  }

  function drawCloud(cx, cy, s) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, 16 * s, 6 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 12 * s, cy + 2, 11 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - 12 * s, cy + 2, 11 * s, 5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawMountainRange(color, baseY, amp, freq, offset) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const yy = baseY - Math.abs(Math.sin((x + offset) * 0.02 * freq)) * amp
                - Math.abs(Math.sin((x + offset) * 0.007 * freq + 1.7)) * amp * 0.6;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawTank(p, isCurrent) {
    ctx.save();
    const bobY = p.alive ? Math.sin(bgTime * 2 + p.bob) * 0.4 : 0;
    ctx.translate(Math.round(p.x), Math.round(p.y + bobY));

    // 그림자 (파워 차징 시 살짝 커짐)
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.beginPath();
    ctx.ellipse(0, 8, 11, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // 캐터필러 트랙
    ctx.fillStyle = p.colorDark;
    ctx.fillRect(-10, 2, 20, 6);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    // 움직이는 트랙 마디
    for (let i = -10; i < 10; i += 3) {
      const off = ((i + (p.treadPhase || 0) * 6) % 20 + 20) % 20 - 10;
      ctx.beginPath();
      ctx.moveTo(off, 3);
      ctx.lineTo(off, 7);
      ctx.stroke();
    }
    // 바퀴
    ctx.fillStyle = '#20222a';
    for (const wx of [-8, -3, 3, 8]) {
      ctx.beginPath();
      ctx.arc(wx, 5, 2.3, 0, Math.PI * 2);
      ctx.fill();
    }

    const shape = p.shape || 'classic';

    // 본체 (그라디언트 셰이딩, 모양별 실루엣)
    const bodyGrad = ctx.createLinearGradient(0, -5, 0, 3);
    bodyGrad.addColorStop(0, p.colorLight);
    bodyGrad.addColorStop(0.35, p.color);
    bodyGrad.addColorStop(1, p.colorDark);
    ctx.fillStyle = bodyGrad;
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    if (shape === 'wedge') {
      ctx.beginPath();
      ctx.moveTo(-8, 3); ctx.lineTo(-9, -3); ctx.lineTo(-3, -6);
      ctx.lineTo(6, -6); ctx.lineTo(9, -1); ctx.lineTo(8, 3);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else if (shape === 'round') {
      ctx.beginPath();
      ctx.moveTo(-7, -5);
      ctx.arcTo(9, -5, 9, 3, 4);
      ctx.arcTo(9, 3, -8, 3, 4);
      ctx.arcTo(-8, 3, -8, -5, 4);
      ctx.arcTo(-8, -5, 9, -5, 4);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else {
      ctx.fillRect(-8, -5, 16, 8);
      ctx.strokeRect(-8.5, -5.5, 17, 9);
    }

    // 피격 시 하얀 플래시 오버레이
    if (p.hitFlash > 0) {
      ctx.globalAlpha = p.hitFlash * 0.7;
      ctx.fillStyle = '#ffffff';
      if (shape === 'wedge') {
        ctx.beginPath();
        ctx.moveTo(-8, 3); ctx.lineTo(-9, -3); ctx.lineTo(-3, -6);
        ctx.lineTo(6, -6); ctx.lineTo(9, -1); ctx.lineTo(8, 3);
        ctx.closePath(); ctx.fill();
      } else if (shape === 'round') {
        ctx.beginPath();
        ctx.arc(0, -1, 8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-8, -5, 16, 8);
      }
      ctx.globalAlpha = 1;
    }

    // 포탑 (모양별 실루엣)
    const turretGrad = ctx.createRadialGradient(-1.5, -7, 1, 0, -5, 6);
    turretGrad.addColorStop(0, p.colorLight);
    turretGrad.addColorStop(1, p.colorDark);
    ctx.fillStyle = turretGrad;
    if (shape === 'wedge') {
      ctx.beginPath();
      ctx.moveTo(-5, -6); ctx.lineTo(0, -12); ctx.lineTo(5, -6);
      ctx.closePath();
      ctx.fill();
    } else if (shape === 'round') {
      ctx.beginPath();
      ctx.arc(0, -7, 5.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, -5, 5, Math.PI, 0);
      ctx.fill();
    }

    // 안테나
    ctx.strokeStyle = p.colorDark;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(4, -9); ctx.lineTo(6, -15);
    ctx.stroke();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(6, -15, 1, 0, Math.PI * 2); ctx.fill();

    // 포신 (반동 애니메이션 포함)
    const rad = deg2rad(toAbsoluteAngle(p));
    const recoilPull = (p.recoil || 0) * 3.5;
    const barrelLen = 13 - recoilPull;
    const bx = Math.cos(rad) * barrelLen, by = -Math.sin(rad) * barrelLen;
    ctx.strokeStyle = '#3a3d47';
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(bx, by - 6);
    ctx.stroke();
    ctx.strokeStyle = '#20222a';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, -6);
    ctx.lineTo(bx, by - 6);
    ctx.stroke();
    ctx.lineCap = 'butt';

    if (isCurrent && state === 'aiming') {
      drawAimTrajectory(p);
      const bounce = Math.sin(bgTime * 6) * 1.5;
      ctx.fillStyle = PAL.uiAccent;
      ctx.beginPath();
      ctx.moveTo(0, -19 + bounce); ctx.lineTo(-4, -14 + bounce); ctx.lineTo(4, -14 + bounce);
      ctx.fill();
    }
    ctx.restore();
  }

  // 조준 중 예상 탄도 미리보기 (흰색 점선). 실제 발사 물리(중력/바람)와 동일한 공식으로
  // 시뮬레이션해서, 차징 중이면 실시간 파워를, 아니면 기본값을 사용해 대략적인 궤적을 보여준다.
  function drawAimTrajectory(p) {
    const angle = toAbsoluteAngle(p);
    const rad = deg2rad(angle);
    const previewPower = p.charging ? p.power : 55;
    const speed = (90 + (previewPower / 100) * 220) * mapScale;
    let x = p.x, y = p.y - Math.sin(rad) * 11;
    let vx = Math.cos(rad) * speed, vy = -Math.sin(rad) * speed;
    const sdt = 0.045;
    const pts = [];
    for (let i = 0; i < 70; i++) {
      vy += 260 * mapScale * sdt;
      vx += wind * 6 * mapScale * sdt;
      x += vx * sdt; y += vy * sdt;
      if (x < 0 || x >= mapW || y >= mapH) break;
      if (terrainSolid(Math.round(x), Math.round(y))) break;
      pts.push({ x: x - p.x, y: y - p.y });
      if (pts.length >= 46) break;
    }
    if (pts.length < 2) return;
    ctx.save();
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    pts.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
    ctx.stroke();
    ctx.setLineDash([]);
    const last = pts[pts.length - 1];
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(last.x, last.y, 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPanel(x, y, w, h) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, 'rgba(28,32,44,0.82)');
    g.addColorStop(1, 'rgba(10,12,18,0.82)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = PAL.uiBorder;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x + 1, y + 1, w - 2, 1.5);
  }

  function drawBar(x, y, w, h, pct, colorFn) {
    ctx.fillStyle = '#22242c';
    ctx.fillRect(x, y, w, h);
    const fillW = Math.max(0, w * clamp(pct, 0, 1));
    const g = ctx.createLinearGradient(x, y, x, y + h);
    const c = colorFn(pct);
    g.addColorStop(0, c.light); g.addColorStop(1, c.dark);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, fillW, h);
    // 광택 하이라이트
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x, y, fillW, Math.max(1, h * 0.35));
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  }

  function fitLabelText(text, maxWidthPx, sizePx) {
    const charW = sizePx * 0.62; // 모노스페이스 폰트의 대략적인 글자 폭
    const maxChars = Math.max(1, Math.floor(maxWidthPx / charW));
    if (text.length <= maxChars) return text;
    return text.slice(0, Math.max(1, maxChars - 1)) + '…';
  }

  function drawHPBar(p, x, w, idPrefix) {
    const h = 9;
    drawPanel(x - 3, 4, w + 6, 24);
    const nameSize = w > 70 ? 11 : (w > 50 ? 9 : 8);
    const rawLabel = p.team ? `${p.team} ${p.name}` : p.name;
    const label = fitLabelText(rawLabel, w - 4, nameSize);
    lbl('hp-name-' + idPrefix, label, x, 12, nameSize, p.colorLight, 'left');
    lbl('hp-num-' + idPrefix, `${Math.max(0, Math.round(p.hp))}`, x + w, 12, 10, PAL.ui, 'right');
    drawBar(x, 16, w, h, p.hp / 100, pct => {
      if (pct > 0.5) return { light: '#8fef7c', dark: '#4aa838' };
      if (pct > 0.25) return { light: '#ffe58c', dark: '#d19a2c' };
      return { light: '#ff8a7a', dark: '#c23a2c' };
    });
    if (!p.alive) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 3, 4, w + 6, 24);
      ctx.restore();
    }
  }

  function drawWindIndicator() {
    const bx = W - 8 - WIND_PANEL_W;
    const cx = bx + WIND_PANEL_W / 2;
    drawPanel(bx, 3, WIND_PANEL_W, 24);
    lbl('wind-label', 'WIND', cx, 11, 10, PAL.ui, 'center');
    ctx.save();
    ctx.translate(cx, 20);
    const mag = clamp(Math.abs(wind) / 8, 0, 1);
    const dir = wind >= 0 ? 1 : -1;
    const col = mag > 0.6 ? PAL.fire2 : PAL.uiAccent;
    ctx.strokeStyle = ctx.fillStyle = col;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    const len = 8 + mag * 20;
    ctx.beginPath();
    ctx.moveTo(-len * dir, 0); ctx.lineTo(len * dir, 0);
    ctx.moveTo(len * dir, 0); ctx.lineTo((len - 6) * dir, -4);
    ctx.moveTo(len * dir, 0); ctx.lineTo((len - 6) * dir, 4);
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.restore();
  }

  function drawAimHUD() {
    const p = players[current];
    const w = WEAPONS[p.weapon];

    // 하단 패널
    drawPanel(0, H - 38, W, 38);

    lbl('turn-name', `▶ ${p.name}`, 8, H - 25, 11, p.colorLight, 'left');
    lbl('turn-angle', `각도 ${Math.round(p.angle)}°`, 8, H - 12, 9, PAL.ui, 'left');

    // 무기 아이콘 + 이름
    drawWeaponIcon(96, H - 26, w);
    lbl('weapon-name', `${w.name}${w.ammo === Infinity ? '' : ' x' + p.ammo[p.weapon]}`, 108, H - 24, 9, PAL.ui, 'left');

    // 연료 바
    lbl('fuel-label', '연료', 108, H - 11, 9, PAL.uiAccent, 'left');
    drawBar(132, H - 15, 56, 6, p.fuel / 100, () => ({ light: '#9fe0ff', dark: '#3c8cc2' }));

    // 파워 바
    lbl('power-label', '파워', 204, H - 26, 9, PAL.uiAccent, 'left');
    const pct = p.power / 100;
    drawBar(204, H - 18, 106, 10, pct, pv => pv > 0.8
      ? { light: '#ff8a7a', dark: '#c23a2c' }
      : { light: '#ffd98c', dark: '#e0982c' });

    // 턴 제한시간 카운트다운
    const urgent = turnTimeLeft <= 6;
    lbl('turn-timer', `⏱ ${Math.ceil(turnTimeLeft)}s`, W - 8, H - 25, 11, urgent ? '#ff8a7a' : PAL.ui, 'right');
    drawBar(W - 62, H - 15, 54, 6, turnTimeLeft / TURN_TIME_LIMIT, () =>
      urgent ? { light: '#ff8a7a', dark: '#c23a2c' } : { light: '#9fe0ff', dark: '#3c8cc2' });

    if (turnMsgTimer > 0) {
      const bw = 190, bh = 28;
      const bx = W / 2 - bw / 2, by = H / 2 - 42;
      drawPanel(bx, by, bw, bh);
      ctx.fillStyle = p.color;
      ctx.fillRect(bx + 4, by + bh / 2 - 6, 3, 12);
      lbl('turn-banner', `${p.name} 의 턴!`, W / 2 + 4, by + bh / 2 + 1, 15, p.colorLight, 'center');
    } else {
      lbl('turn-banner', '', 0, 0, 15, '#fff', 'center');
    }
  }

  function drawWeaponIcon(x, y, w) {
    ctx.save();
    ctx.translate(x, y);
    if (w.name.includes('미사일') || w.color === '#c8a0ff') {
      ctx.fillStyle = '#c8a0ff';
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-4, 4); ctx.lineTo(0, -5); ctx.lineTo(4, 4); ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = '#6a6d78';
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#d8d6c8';
      ctx.beginPath();
      ctx.arc(-1.6, -1.6, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    particles.forEach(pt => {
      const lt = clamp(pt.life / (pt.maxLife || 0.6), 0, 1);
      if (pt.kind === 'ring') {
        ctx.globalAlpha = lt * 0.8;
        ctx.strokeStyle = pt.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius * (1 - lt) * 1.3 + 2, 0, Math.PI * 2);
        ctx.stroke();
      } else if (pt.kind === 'smoke') {
        ctx.globalAlpha = lt * 0.55;
        const sz = pt.size * (1 + (1 - lt) * (pt.grow || 1));
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, sz, 0, Math.PI * 2);
        ctx.fill();
      } else if (pt.kind === 'debris') {
        ctx.globalAlpha = lt;
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(pt.rot || 0);
        ctx.fillStyle = pt.color;
        ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
        ctx.restore();
      } else if (pt.kind === 'confetti') {
        ctx.globalAlpha = lt;
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(pt.rot || 0);
        ctx.fillStyle = pt.color;
        ctx.fillRect(-2, -3, 4, 6);
        ctx.restore();
      } else {
        // fire / spark 기본
        ctx.globalAlpha = lt;
        ctx.fillStyle = pt.color;
        const sz = pt.size || 3;
        ctx.fillRect(Math.round(pt.x) - sz / 2, Math.round(pt.y) - sz / 2, sz, sz);
      }
    });
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    if (state === 'title') {
      drawSky();

      // 로고 글로우 (배경 장식용 실루엣 텍스트, 실제 선명한 텍스트는 DOM 라벨)
      lbl('title-main', '온라인 포트리스', W / 2, H / 2 - 58, 26, PAL.ui, 'center');
      lbl('title-sub', 'made by m00n', W / 2, H / 2 - 30, 11, PAL.uiDim, 'center');

      // 장식용 대치 탱크 실루엣
      ctx.save();
      const tt = { x: W / 2 - 70, y: H / 2 + 2, angle: 55, facing: 1, color: PAL.p1, colorLight: PAL.p1Light, colorDark: PAL.p1Dark, recoil: 0, treadPhase: bgTime, bob: 0, alive: true, hitFlash: 0 };
      drawTank(tt, false);
      const tt2 = { x: W / 2 + 70, y: H / 2 + 2, angle: 55, facing: -1, color: PAL.p2, colorLight: PAL.p2Light, colorDark: PAL.p2Dark, recoil: 0, treadPhase: bgTime, bob: 3, alive: true, hitFlash: 0 };
      drawTank(tt2, false);
      ctx.restore();

      const btnW = 130, btnH = 34, btnX = W / 2 - btnW / 2, btnY = H / 2 + 34;
      const bg = ctx.createLinearGradient(0, btnY, 0, btnY + btnH);
      bg.addColorStop(0, '#7fd35c'); bg.addColorStop(1, '#4a9832');
      ctx.fillStyle = bg;
      ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.strokeStyle = '#2f5a1a'; ctx.lineWidth = 2;
      ctx.strokeRect(btnX, btnY, btnW, btnH);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(btnX + 2, btnY + 2, btnW - 4, btnH * 0.35);
      lbl('start-btn', '시작하기', W / 2, btnY + btnH / 2, 14, '#fff', 'center', 'middle');
      hideUnusedLabels();
      ctx.restore();
      return;
    }

    if (state === 'setup') {
      drawSky();
      hideUnusedLabels();
      ctx.restore();
      return;
    }

    updateCamera();
    drawSky();

    // ---- 여기부터는 월드 좌표계: 카메라만큼 화면을 옮겨서 그림 ----
    ctx.save();
    ctx.translate(-camX, -camY);

    ctx.drawImage(terrCanvas, 0, 0);
    drawParticles();
    players.forEach((p, i) => drawTank(p, i === current));

    if (projectile) {
      const proj = projectile;
      const wdef = WEAPONS[proj.weapon];
      proj.trail.forEach((t, i) => {
        const a = (i / proj.trail.length);
        ctx.globalAlpha = a * 0.55;
        const gr = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 4);
        gr.addColorStop(0, wdef.color === '#3b3b3b' ? '#ffcf5c' : '#c88cff');
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3.5 * a + 1, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      // 회전하는 포탄 본체
      proj.spin = (proj.spin || 0) + 0.35;
      ctx.save();
      ctx.translate(proj.x, proj.y);
      ctx.rotate(proj.spin);
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.ellipse(0, 0, 3.4, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = wdef.color === '#3b3b3b' ? '#4a4a4a' : '#8a4fd1';
      ctx.beginPath();
      ctx.ellipse(-0.8, -0.6, 1.2, 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
    // ---- 여기서부터는 다시 화면(스크린) 좌표계 ----

    // 화면 섬광 (피격/폭발 시)
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,240,200,${flash * 0.35})`;
      ctx.fillRect(0, 0, W, H);
    }

    {
      const barW = layoutHPBarWidth();
      let hpx = 8;
      players.forEach((p, i) => { drawHPBar(p, hpx, barW, String(i)); hpx += barW + 6; });
    }
    drawWindIndicator();

    if (state === 'aiming') drawAimHUD();

    if (missMsgTimer > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(W / 2 - 74, H / 2 - 11, 148, 22);
      lbl('miss-msg', missMsg, W / 2, H / 2, 14, PAL.ui, 'center');
    } else {
      lbl('miss-msg', '', 0, 0, 14, PAL.ui, 'center');
    }

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.58)';
      ctx.fillRect(0, 0, W, H);

      // 오버레이 위로 컨페티가 보이도록 다시 그리기 (월드 좌표계 - 카메라 오프셋 적용)
      ctx.save();
      ctx.translate(-camX, -camY);
      particles.forEach(pt => {
        if (pt.kind !== 'confetti') return;
        const lt = clamp(pt.life / (pt.maxLife || 3), 0, 1);
        ctx.globalAlpha = lt;
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(pt.rot || 0);
        ctx.fillStyle = pt.color;
        ctx.fillRect(-2, -3, 4, 6);
        ctx.restore();
      });
      ctx.globalAlpha = 1;
      ctx.restore();

      let winColor, msg;
      if (teamMode && winnerTeam) {
        const rep = players.find(p => p.team === winnerTeam);
        winColor = rep ? rep.color : PAL.uiAccent;
        msg = `Team ${winnerTeam} 승리!`;
      } else if (winner < 0) {
        winColor = PAL.uiAccent;
        msg = '무승부!';
      } else {
        winColor = players[winner].color;
        msg = `${players[winner].name} 승리!`;
      }
      lbl('gameover-msg', msg, W / 2, H / 2 - 42, 22, winColor, 'center');

      function drawGoBtnBg(x, y, w, h) {
        const bg = ctx.createLinearGradient(0, y, 0, y + h);
        bg.addColorStop(0, '#7fd35c'); bg.addColorStop(1, '#4a9832');
        ctx.fillStyle = bg;
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#2f5a1a'; ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(x + 2, y + 2, w - 4, h * 0.35);
      }
      if (onlineMode) {
        const btnW = 150, btnH = 34, btnX = W / 2 - btnW / 2, btnY = H / 2 + 40;
        drawGoBtnBg(btnX, btnY, btnW, btnH);
        lbl('gameover-btn', '새로 시작하기', W / 2, btnY + btnH / 2, 14, '#fff', 'center', 'middle');
        lbl('gameover-btn2', '', 0, 0, 12, '#fff', 'center');
      } else {
        const btnW = 122, gap = 10, btnH = 34;
        const totalW = btnW * 2 + gap;
        const startX = W / 2 - totalW / 2, btnY = H / 2 + 40;
        drawGoBtnBg(startX, btnY, btnW, btnH);
        drawGoBtnBg(startX + btnW + gap, btnY, btnW, btnH);
        lbl('gameover-btn', '같은 참가자로', startX + btnW / 2, btnY + btnH / 2, 12, '#fff', 'center', 'middle');
        lbl('gameover-btn2', '새로 설정하기', startX + btnW + gap + btnW / 2, btnY + btnH / 2, 12, '#fff', 'center', 'middle');
      }
    } else {
      lbl('gameover-msg', '', 0, 0, 22, '#fff', 'center');
      lbl('gameover-btn', '', 0, 0, 14, '#fff', 'center');
      lbl('gameover-btn2', '', 0, 0, 12, '#fff', 'center');
    }

    hideUnusedLabels();
    ctx.restore();
  }

  // ---------------------------------------------------------------------
  // 메인 루프
  // ---------------------------------------------------------------------
  function loop(now) {
    const dt = Math.min(0.033, (now - lastT) / 1000);
    lastT = now;
    if (state !== 'title' && state !== 'setup') update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
</body>
</html>
